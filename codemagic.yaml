workflows:
  ios-release:
    name: Baus Taka iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.29.3
      xcode: 16.3
      cocoapods: default

    scripts:
      - name: Clean project
        script: |
          flutter clean

      - name: Get dependencies
        script: |
          flutter pub upgrade
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Prepare env
        script: |
          cp .env.copy .env || touch .env

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
workflows:
  ios-release:
    name: Baus Taka iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Handle .env Asset
        script: |
          # Creates a dummy .env from your copy so the asset bundler doesn't fail
          cp .env.copy .env || touch .env
          
      - name: Fetch Dart dependencies
        script: |
          flutter pub get

      - name: Clean and Install CocoaPods
        script: |
          # This prevents stale iOS configs that cause the Null check error
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          # --no-native-assets bypasses the specific crash at xcode_backend.dart:345
          # --no-codesign is used for testing builds without Apple certs
          flutter build ios --release --no-codesign --no-native-assets

    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  ios-release:
    name: Stable iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.27.0   # 👈 DOWNGRADE (important)
      xcode: 16.3
      cocoapods: default

    scripts:
      - name: Clean everything
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/Flutter

      - name: Get packages
        script: |
          flutter pub upgrade
          flutter pub get

      - name: Precache iOS
        script: flutter precache --ios

      - name: Recreate iOS build files
        script: |
          flutter build ios --release --no-codesign

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
workflows:
  ios-release:
    name: Baus Taka iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: 3.24.2 # Stick to your project's version
      xcode: latest
      vars:
        # These force the backend script to see valid strings instead of nulls
        FLUTTER_BUILD_MODE: "release"
        ACTION: "install"
    scripts:
      - name: Prepare Assets
        script: |
          # Ensure .env exists so asset bundling doesn't crash
          cp .env.copy .env || touch .env
          
      - name: Fetch Dependencies
        script: |
          flutter pub get

      - name: Refresh iOS Configs
        script: |
          cd ios
          # Clean out stale configuration files that might hold null references
          rm -rf Pods
          rm -f Podfile.lock
          rm -f Flutter/Generated.xcconfig
          rm -f Flutter/Release.xcconfig
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          # --no-native-assets is critical to bypass the crashing function
          # --no-tree-shake-icons avoids a separate common null-check crash
          flutter build ios --release --no-codesign --no-native-assets --no-tree-shake-icons
          
    artifacts:
      - build/ios/iphoneos/*.app
workflows:
  ios-release:
    name: iOS Build Fix
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.29.3
      xcode: 16.3
      cocoapods: default

    scripts:
      - name: Clean
        script: flutter clean

      - name: Get packages
        script: |
          flutter pub upgrade
          flutter pub get

      - name: Fix iOS Flutter cache
        script: |
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          flutter precache --ios

      - name: Install pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Generate iOS build (IMPORTANT)
        script: flutter build ios --release --no-codesign

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
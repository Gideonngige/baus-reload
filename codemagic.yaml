workflows:
  ios-release:
    name: Final iOS Fix
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: 3.27.0   # stay on stable
      xcode: 16.3

    scripts:
      - name: FULL CLEAN
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/Flutter
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: GET PACKAGES
        script: |
          flutter pub upgrade
          flutter pub get

      - name: PRECACHE IOS
        script: flutter precache --ios

      # 🔥 THIS STEP IS THE MOST IMPORTANT
      - name: GENERATE IOS PROJECT FILES
        script: flutter build ios --release --no-codesign

      - name: INSTALL PODS (AFTER BUILD!)
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: VERIFY GENERATED CONFIG
        script: |
          echo "==== Generated.xcconfig ===="
          cat ios/Flutter/Generated.xcconfig || echo "Missing!"
          echo "============================"

      - name: BUILD IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
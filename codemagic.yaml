workflows:
  ios-release:
    name: Baus Taka iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      # Force these variables so the script doesn't find a 'null' value
      vars:
        FLUTTER_SUPPRESS_ANALYTICS: "true"
        # The crash often happens because this is missing in the sub-shell
        FLUTTER_BUILD_MODE: "release" 
    scripts:
      - name: Set up .env and Assets
        script: |
          cp .env.copy .env || touch .env
          # Ensure there are no empty asset folders that trip up the native bundler
          find . -type d -empty -delete 

      - name: Fetch dependencies
        script: |
          flutter pub get

      - name: CocoaPods and Config Fix
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          # Force refresh the xcconfig files
          rm -f Flutter/Generated.xcconfig
          rm -f Flutter/Release.xcconfig
          pod install
          cd ..

      - name: Build iOS IPA
        script: |
          # Added --no-native-assets AND --no-tree-shake-icons to reduce script complexity
          flutter build ios --release --no-codesign --no-native-assets --no-tree-shake-icons
    artifacts:
      - build/ios/iphoneos/*.app
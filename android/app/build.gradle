// Switch from "apply plugin: ..." to the newer plugins block:
plugins {
    // Must match the plugin IDs declared in the project-level build.gradle
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
}

// Read local.properties for Flutter
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Automatically include Flutter’s Gradle logic:
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "ke.co.baustaka.client"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId rootProject.ext.applicationId
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // If need multiDex:
        multiDexEnabled true
    }

    signingConfigs {
        releaseConfig {
            keyAlias rootProject.ext.keyAlias
            keyPassword rootProject.ext.keyPassword
            storeFile rootProject.ext.storeFile
            storePassword rootProject.ext.storePassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.releaseConfig
            manifestPlaceholders = [
                usesCleartextTraffic: "true",
                appName: rootProject.ext.appName
            ]
            minifyEnabled true
            shrinkResources true
            // useProguard true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            manifestPlaceholders = [
                usesCleartextTraffic: "true",
                appName: rootProject.ext.appName
            ]
            signingConfig signingConfigs.releaseConfig
        }
    }
}

// Flutter DSL for linking the module to the Flutter root:
flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22"

    implementation "androidx.multidex:multidex:2.0.1"
}
